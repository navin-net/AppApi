services:
  - type: web
    name: appapi
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-young-fog-be9vdzqz-pooler.c-9.us-east-2.aws.neon.tech/neondb?sslmode=require&channelBinding=require
      - key: POSTGRES_USER
        value: neondb_owner
      - key: POSTGRES_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_MINUTES
        value: "60"
      - key: SEED_OWNER_PASSWORD
        sync: false
