name: AppApi - Production Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: appapi-production
  cancel-in-progress: false

jobs:
  test:
    name: Test Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Run Tests
        run: ./mvnw -B clean verify

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "ERROR: Render Deploy Hook is missing."
            exit 1
          fi

          echo "Triggering Render deployment..."

          HTTP_CODE=$(curl -sS \
            -o render-response.json \
            -w "%{http_code}" \
            -X POST "$RENDER_DEPLOY_HOOK_URL")

          echo "Render HTTP Status: $HTTP_CODE"

          if [[ ! "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            echo "ERROR: Render deployment request failed."
            cat render-response.json
            exit 1
          fi

          echo "Render accepted the deployment request."

          if [ -s render-response.json ]; then
            cat render-response.json
          fi

      - name: Deployment Summary
        if: success()
        run: |
          echo "## AppApi Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Spring Boot tests: Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Render deployment: Trigger accepted" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: production" >> "$GITHUB_STEP_SUMMARY"
