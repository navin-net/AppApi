# Environment
spring.config.import=optional:file:.env[.properties]

# Application
spring.application.name=AppApi
server.port=8282

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=${RENAME}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Existing databases may already have the application schema from Hibernate.
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=${JWT_MINUTES}

app.seed.owner.username=owner
app.seed.owner.password=123
app.seed.owner.full-name=Owner
