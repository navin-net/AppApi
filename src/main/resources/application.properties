# Application
spring.application.name=AppApi
server.port=${PORT:8280}

# Database
# Set in .env: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=${RENAME:org.example.appapi.config.PrefixPhysicalNamingStrategy}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Existing databases may already have the application schema from Hibernate.
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=${JWT_MINUTES:60}

# Seed owner
app.seed.owner.username=owner
app.seed.owner.password=${SEED_OWNER_PASSWORD}
app.seed.owner.full-name=Owner